<title>QG Vik Studios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: app shell — fixed left rail (nav + owner filter), main area swaps views by #hash.
   Planner views are horizontal strips of time columns (Timestripe-like); other views are dense panels. */
:root{
  --bg:#18191C; --panel:#202125; --panel-2:#26272C; --line:#2F3136; --line-2:#3A3C42;
  --ink:#ECECEE; --muted:#9A9CA3; --faint:#62646B;
  --now:#F2762E; --now-soft:#3A2618;
  --blue:#5E8BFF; --blue-soft:#1E2A47;
  --good:#3DBE7C; --good-soft:#163526; --bad:#F06262; --bad-soft:#3D1D1D; --warn:#E8B547; --warn-soft:#3A3018;
  --max:#38C6B0; --max-soft:#143A35; --adrien:#E68AD2; --adrien-soft:#3D2238; --both:#A9ABB2; --both-soft:#2C2D32;
  --c1:#5E8BFF; --c2:#38C6B0; --c3:#F2762E; --c4:#E8B547; --c5:#E68AD2; --c6:#8E93A0; --c7:#3DBE7C;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F5F5F3; --panel:#FFFFFF; --panel-2:#F0F0EE; --line:#E3E3E0; --line-2:#D4D4D0;
  --ink:#1A1B1E; --muted:#686A71; --faint:#A3A5AB;
  --now:#D9601B; --now-soft:#FBE7DA; --blue:#2F5FE0; --blue-soft:#E2E9FD;
  --good:#1E9A5B; --good-soft:#DDF3E7; --bad:#D13D3D; --bad-soft:#FBE2E2; --warn:#B98410; --warn-soft:#FAF0D6;
  --max:#0E8F7E; --max-soft:#DCF2EE; --adrien:#B5419C; --adrien-soft:#F7E1F2; --both:#5F6168; --both-soft:#ECECEA;
  --c1:#2F5FE0; --c2:#0E8F7E; --c3:#D9601B; --c4:#B98410; --c5:#B5419C; --c6:#7D818C; --c7:#1E9A5B;
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F5F5F3; --panel:#FFFFFF; --panel-2:#F0F0EE; --line:#E3E3E0; --line-2:#D4D4D0;
  --ink:#1A1B1E; --muted:#686A71; --faint:#A3A5AB;
  --now:#D9601B; --now-soft:#FBE7DA; --blue:#2F5FE0; --blue-soft:#E2E9FD;
  --good:#1E9A5B; --good-soft:#DDF3E7; --bad:#D13D3D; --bad-soft:#FBE2E2; --warn:#B98410; --warn-soft:#FAF0D6;
  --max:#0E8F7E; --max-soft:#DCF2EE; --adrien:#B5419C; --adrien-soft:#F7E1F2; --both:#5F6168; --both-soft:#ECECEA;
  --c1:#2F5FE0; --c2:#0E8F7E; --c3:#D9601B; --c4:#B98410; --c5:#B5419C; --c6:#7D818C; --c7:#1E9A5B;
  color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:inherit}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--line);padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px;background:var(--bg)}
.logo{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;padding:0 8px}
.logo small{display:block;font-family:var(--mono);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:10px 8px 4px}
.nav a{display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:var(--muted);padding:6px 8px;border-radius:7px;font-weight:500}
.nav a:hover{color:var(--ink);background:var(--panel)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--panel-2)}
.nav a .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.who{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.who .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:0 8px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:5px 4px;color:var(--muted);font-size:12.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.sync{font-size:11.5px;color:var(--faint);padding:0 8px;min-height:16px}
.sync.warn{color:var(--bad)}

main{min-width:0;padding-block:22px 40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.view-head h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;margin:0;line-height:1.05}
.view-head h1 .sub{font-family:var(--body);font-weight:400;font-size:15px;color:var(--muted);margin-left:10px;letter-spacing:0}
.pager{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.pager button{border:0;background:transparent;border-radius:6px;padding:4px 10px;color:var(--muted)}
.pager button:hover{color:var(--ink);background:var(--panel-2)}

/* ---------- planner ---------- */
.strip{display:flex;gap:0;overflow-x:auto;min-height:calc(100dvh - 120px);border-top:1px solid var(--line)}
.col{flex:0 0 290px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.col.wide{flex:1 1 420px;min-width:320px;max-width:640px}
.col-h{padding:14px 14px 8px}
.col-h .t{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.1}
.col-h .s{color:var(--muted);font-size:13.5px;margin-top:2px}
.col.now .col-h .t,.col.now .col-h .s{color:var(--now)}
.col-b{flex:1;padding:4px 8px 24px;display:flex;flex-direction:column;gap:2px;min-height:120px}
.col-b.over{background:var(--panel)}
.vstrip{flex:0 0 46px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:transparent;border-top:0;border-bottom:0;border-left:0;color:var(--muted);padding:12px 0}
.vstrip:hover{background:var(--panel);color:var(--ink)}
.vstrip span.v{writing-mode:vertical-rl;transform:rotate(180deg);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600}
.vstrip .badge{font-family:var(--mono);font-size:11px;color:var(--faint)}
.collapse{border:0;background:transparent;color:var(--faint);font-size:12px;float:right;padding:2px 4px}
.collapse:hover{color:var(--ink)}
.late-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--bad);padding:6px 8px 2px}

.it{border-radius:8px;padding:5px 6px;display:flex;flex-direction:column;gap:2px;position:relative}
.it:hover{background:var(--panel)}
.it.top-goal{background:var(--blue-soft)}
.it .row{display:flex;align-items:flex-start;gap:8px}
.grip{cursor:grab;color:var(--faint);opacity:0;font-size:12px;line-height:20px;width:10px;flex:none;user-select:none}
.it:hover .grip{opacity:1}
.ck{appearance:none;flex:none;width:17px;height:17px;border:1.5px solid var(--line-2);border-radius:5px;margin:2px 0 0;background:transparent;display:grid;place-items:center;cursor:pointer}
.ck:checked{background:var(--good);border-color:var(--good)}
.ck:checked::after{content:"";width:8px;height:4px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.ttl{flex:1;min-width:0;outline:none;word-break:break-word;border-radius:4px;line-height:20px}
.ttl:focus{background:var(--panel-2)}
.it.done>.row .ttl{color:var(--faint);text-decoration:line-through}
.dot{flex:none;border:0;width:22px;height:20px;border-radius:6px;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0}
.dot.max{background:var(--max-soft);color:var(--max)}.dot.adrien{background:var(--adrien-soft);color:var(--adrien)}.dot.both{background:var(--both-soft);color:var(--both)}
.tools{display:flex;gap:2px;opacity:0;flex:none}
.it:hover>.row .tools,.it:focus-within>.row .tools{opacity:1}
.tb{border:0;background:transparent;color:var(--muted);border-radius:5px;width:22px;height:20px;display:grid;place-items:center;font-size:13px;padding:0}
.tb:hover{background:var(--panel-2);color:var(--ink)}
.tb.del:hover{color:var(--bad)}
.subs{margin-left:43px;font-size:12px;color:var(--muted);border:0;background:transparent;padding:0;text-align:left}
.subs:hover{color:var(--ink)}
.kids{margin-left:26px;display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--line);padding-left:6px}
.kids .it{padding:3px 6px}
.add{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 24px}
.add .box{width:17px;height:17px;border:1.5px dashed var(--line-2);border-radius:5px;flex:none}
.add input{flex:1;min-width:0;border:0;background:transparent;padding:2px 0;outline:none}
.add input::placeholder{color:var(--faint)}
.kids .add{padding-left:6px}
.confirm{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--bad);margin-left:43px}
.confirm button{border:1px solid var(--line-2);background:var(--panel);border-radius:5px;padding:1px 8px;font-size:12px}
.confirm .yes{background:var(--bad);border-color:var(--bad);color:#fff}
.menu{position:absolute;right:6px;top:28px;z-index:20;background:var(--panel);border:1px solid var(--line-2);border-radius:9px;padding:4px;display:flex;flex-direction:column;min-width:170px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.menu button{border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:6px;font-size:13px}
.menu button:hover{background:var(--panel-2)}
.menu .h{font-size:11px;color:var(--faint);padding:4px 10px;text-transform:uppercase;letter-spacing:.06em}

/* ---------- dashboard ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-family:var(--mono)}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h3{margin:0 0 4px;font-size:15px;font-weight:600}
.panel .cap{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.three{grid-template-columns:1fr 1fr}}
@media (max-width:820px){.two,.three{grid-template-columns:1fr}}
.chart{position:relative;height:230px}
.sec{font-family:var(--display);font-weight:800;font-size:20px;margin:30px 0 12px;letter-spacing:-.01em}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-blue{background:var(--blue-soft);color:var(--blue)}.p-mute{background:var(--panel-2);color:var(--muted)}
.minibar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;min-width:60px}
.minibar span{display:block;height:100%;background:var(--blue)}
.anom{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.anom:last-child{border-bottom:0}
.anom .amt{font-family:var(--mono);font-size:13px;white-space:nowrap;margin-left:auto}
.anom.ok .txt{opacity:.5}
.dec{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:12px;align-items:start}
.dec:last-child{border-bottom:0}
.dec .date{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.dec .w{font-weight:600}
.dec .why{color:var(--muted);font-size:13px;margin-top:2px}
@media (max-width:600px){.dec{grid-template-columns:1fr}}
.form{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 10px;min-width:0}
.form input.grow,.form textarea.grow{flex:1 1 260px}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.note{color:var(--muted);font-size:12.5px}

/* ---------- process ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day .dn{font-weight:600;font-size:13px}
.day.today{border-color:var(--now)}
.day.today .dn{color:var(--now)}
.chip{font-size:12px;padding:5px 8px;border-radius:7px;background:var(--panel-2);border-left:3px solid var(--both);line-height:1.3}
.chip.max{border-left-color:var(--max)}.chip.adrien{border-left-color:var(--adrien)}.chip.os{border-left-color:var(--blue)}
.chip small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.daily{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.flows{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.flow{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.flow h3{font-family:var(--display);font-weight:800;font-size:19px;margin:0;letter-spacing:-.01em}
.flow .meta{color:var(--muted);font-size:12.5px;margin:4px 0 14px}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps li{position:relative;padding:0 0 14px 34px}
.steps li::before{content:"";position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--line-2)}
.steps li:last-child::before{display:none}
.steps .nd{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--panel-2);border:2px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.steps li.start .nd{border-color:var(--blue);color:var(--blue)}
.steps li.end .nd{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.steps li.gate .nd{border-color:var(--warn);color:var(--warn);border-radius:6px;transform:rotate(45deg)}
.steps li.gate .nd b{transform:rotate(-45deg);font-weight:500}
.steps .st{font-weight:600;line-height:1.3;padding-top:2px}
.steps .who-t{display:inline-block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.w-max{background:var(--max-soft);color:var(--max)}.w-adrien{background:var(--adrien-soft);color:var(--adrien)}.w-os{background:var(--blue-soft);color:var(--blue)}.w-hm{background:var(--warn-soft);color:var(--warn)}.w-poster{background:var(--panel-2);color:var(--ink)}.w-claude{background:var(--now-soft);color:var(--now)}
.steps .sd{color:var(--muted);font-size:13px;margin-top:2px}
.steps .br{margin-top:6px;font-size:12.5px;padding:6px 9px;border-radius:7px;background:var(--bad-soft);color:var(--bad)}
.steps .br.ok{background:var(--good-soft);color:var(--good)}
.flow .rules{margin-top:6px;padding-top:12px;border-top:1px dashed var(--line-2);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.flow .rules b{color:var(--ink);font-weight:600}

/* ---------- links & vault ---------- */
.lgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lk{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px}
.lk:hover{background:var(--panel-2)}
.lk a{text-decoration:none;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .host{font-family:var(--mono);font-size:11px;color:var(--faint)}
.fav{width:26px;height:26px;border-radius:7px;background:var(--panel-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.warnbox{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.warnbox b{color:var(--warn)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 10px}
.locked{padding:30px;text-align:center;color:var(--muted)}

/* priority + identity */
.ttl:empty::before{content:attr(data-ph);color:var(--faint)}
.it.urgent{box-shadow:inset 2px 0 0 var(--bad)}
.prio{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:2px 6px;line-height:16px;border:0}
.prio.urgent{background:var(--bad-soft);color:var(--bad)}
.prio.later{background:var(--panel-2);color:var(--faint)}
.where{margin-left:43px;font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.where.late{color:var(--bad)}
.pcol .col-h .t{display:flex;align-items:center;gap:8px}
.pcol .col-h .t i{width:9px;height:9px;border-radius:50%;display:inline-block}
.me{display:flex;align-items:center;gap:8px;padding:0 8px;font-size:12.5px;color:var(--muted)}
.me b{color:var(--ink);font-weight:600}
.me button{border:0;background:transparent;color:var(--faint);font-size:12px;padding:0;text-decoration:underline}
.avatar{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-family:var(--display);font-size:13px}
.avatar.max{background:var(--max-soft);color:var(--max)}.avatar.adrien{background:var(--adrien-soft);color:var(--adrien)}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate-in{width:min(520px,100%);display:flex;flex-direction:column;gap:22px}
.gate h2{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,54px);letter-spacing:-.03em;line-height:.95;margin:0}
.gate h2 span{color:var(--now)}
.gate p{color:var(--muted);margin:0;font-size:15px}
.gate .pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}

<script>

/* ================= helpers ================= */

/* re-render without losing typing */

/* ================= planner ================= */

function addRow(id,ph,onAdd){const inp=h("input",{type:"text",id:"add-"+id,placeholder:ph,"aria-label":ph,autocomplete:"off"});

function newItem(b,prio){return v=>add("items",{title:v,bucket:b,owner:who!=="all"?who:(me||"both"),prio:prio||"normal",done:false,parentId:null,order:Date.now(),createdAt:Date.now()})}
function viewPrio(){
  const open=S.items.filter(i=>!i.parentId&&!i.done&&vis(i));
  const bdate=i=>i.bucket.startsWith("d:")?i.bucket.slice(2):i.bucket.startsWith("w:")?"~"+i.bucket:i.bucket.startsWith("m:")?"~~"+i.bucket:"~~~"+i.bucket;

function column(b,title,sub,opts={}){
  const body=h("div",{class:"col-b"});

  rootsIn(b).forEach(i=>body.append(itemEl(i)));

  body.addEventListener("dragleave",()=>body.classList.remove("over"));
  body.addEventListener("drop",e=>{e.preventDefault();body.classList.remove("over");const id=dragId;dragId=null;if(!id)return;const it=S.items.find(x=>x.id===id);if(it&&it.bucket!==b)upd("items",id,{bucket:b,order:Date.now()})});

/* ================= dashboard ================= */
